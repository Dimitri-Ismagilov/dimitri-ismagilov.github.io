name: Deploy static content to Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 18

    - run: npm install

    - name: Install Vite
      run: npm install vite

    - name: Grant execute permission for Vite
      run: chmod +x ./node_modules/.bin/vite

    - run: npm run build
